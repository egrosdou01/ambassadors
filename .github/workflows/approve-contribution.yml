name: Approve ambassador contribution

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: approve-contribution-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - id: command
        name: Detect approval command
        uses: actions/github-script@v8
        with:
          script: return context.payload.comment.body.trimStart().startsWith('/approve')

      - uses: actions/checkout@v6
        if: steps.command.outputs.result == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v6
        if: steps.command.outputs.result == 'true'
        with:
          node-version: 22
      - if: steps.command.outputs.result == 'true'
        run: npm ci

      - id: approval
        name: Verify human approval and prepare record
        if: steps.command.outputs.result == 'true'
        run: node scripts/record-approval.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # Pull requests opened with github.token do not trigger validate-data.yml, so the
      # record is validated here instead of merging unchecked.
      - name: Validate the prepared record
        if: steps.approval.outputs.approved == 'true'
        run: |
          npm run validate:data
          npm test
          npm run build
          npm run verify:pages

      - name: Explain rejected approval
        if: steps.approval.outputs.approved == 'false'
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ steps.approval.outputs.comment_body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT_BODY,
            })

      - id: pull-request
        name: Open contribution record pull request
        if: steps.approval.outputs.approved == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ${{ steps.approval.outputs.branch }}
          delete-branch: true
          add-paths: contributions/contributions.yml
          commit-message: ${{ steps.approval.outputs.pr_title }}
          title: ${{ steps.approval.outputs.pr_title }}
          body: ${{ steps.approval.outputs.pr_body }}
          labels: contribution-record,status:approved

      - name: Link pull request from issue
        if: steps.approval.outputs.approved == 'true' && steps.pull-request.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          RECORD_ID: ${{ steps.approval.outputs.record_id }}
        with:
          script: |
            const labels = context.payload.issue.labels
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter((label) => !label.startsWith('status:'))
            labels.push('status:pr-open')
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- ambassador-approval -->\nApproved contribution \`${process.env.RECORD_ID}\` has been prepared in #${process.env.PR_NUMBER}. Automation will merge the validated record and rebuild the dashboard.`,
            })

      - id: merge
        name: Merge the validated contribution record
        if: steps.approval.outputs.approved == 'true' && steps.pull-request.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        with:
          script: |
            if (!process.env.HEAD_SHA) throw new Error('Missing validated pull request head SHA.')
            const result = await github.rest.pulls.merge({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
              sha: process.env.HEAD_SHA,
              merge_method: 'squash',
            })
            if (!result.data.merged) throw new Error(`Automatic merge failed: ${result.data.message}`)

      # Merges made with github.token do not trigger the closed-PR or push workflows.
      # Dispatch the dashboard and finalize the issue explicitly in this run.
      - name: Queue dashboard rebuild
        if: steps.merge.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy-dashboard.yml',
              ref: 'main',
            })

      - name: Credit and close the submission
        if: steps.merge.outcome == 'success'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        with:
          script: |
            const status = 'status:credited'
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: status })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({
                ...context.repo,
                name: status,
                color: 'B7F34A',
                description: 'Contribution record merged into the central ledger',
              })
            }
            const issue = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number })
            const labels = issue.data.labels
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter((label) => !label.startsWith('status:'))
            labels.push(status)
            await github.rest.issues.setLabels({ ...context.repo, issue_number: context.issue.number, labels })
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' })
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `<!-- ambassador-finalization -->\nContribution record automatically merged in #${process.env.PR_NUMBER}. The dashboard rebuild has been queued.`,
            })

      - name: Report a failed approval run
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- ambassador-approval -->\nThe approval workflow could not complete all automatic steps (record preparation, merge, dashboard rebuild, and issue finalization). Inspect the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the failing step before retrying.`,
            })
